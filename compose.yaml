services:
  ingest:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8001:8001"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in .env}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: "*"  # trust X-Forwarded-For from cloudflared; 8000 is only bound to localhost
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - voyage-models:/app/models
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Voyage speed-model training: a one-shot job, not a server. On the Vultr instance, e.g. weekly cron:
  #   docker compose --profile train run --rm voyage-train
  # Publishes to Vultr Object Storage when VULTR_OBJECT_STORAGE_* is set (the API reloads it within
  # an hour), and always to the shared volume.
  voyage-train:
    profiles: [train]
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in .env}
    command: ["python", "-m", "voyage.train"]
    env_file: .env
    volumes:
      - voyage-models:/app/models
    security_opt:
      - no-new-privileges:true

  # Exposes api at PUBLIC_BASE_URL with no router port forwarding (works behind CGNAT).
  # Route in Cloudflare Zero Trust > Tunnels: trynostos.biz -> HTTP api:8000 (dashboard at /, MCP at /mcp)
  tunnel:
    profiles: [tunnel]  # docker compose --profile tunnel up -d
    image: cloudflare/cloudflared:2025.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true

volumes:
  voyage-models:
