# Hourly ingest: national EIA-930 demand + forecast (every BA, region and sub-BA zone)
# and NOAA weather (NBM bulletins, NWS gridpoint forecasts, NWS observations, GFS global model).
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   TIMESCALE_SERVICE_URL  required
#   EIA_API_KEY            required (free: https://www.eia.gov/opendata/register.php)
#   NWS_USER_AGENT         optional, e.g. "nostos-ingest (team-contact@example.com)";
#                          api.weather.gov asks clients to identify themselves
#   PGPASSWORD             required unless TIMESCALE_SERVICE_URL contains the password
#                          (Tiger Cloud's credentials file keeps it on its own PGPASSWORD line).
#                          TIMESCALE_PASSWORD / TIMESCALE_SERVICE_PASSWORD also work.
name: ingest

on:
  schedule:
    - cron: "17 * * * *"      # :17 past every hour (UTC); off the top of the hour, when Actions is busiest
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ingest/update.py --skip ships  # ships: the ingest container's hourly job (compose.yaml)
        env:
          TIMESCALE_SERVICE_URL: ${{ secrets.TIMESCALE_SERVICE_URL }}
          PGPASSWORD: ${{ secrets.PGPASSWORD || secrets.TIMESCALE_PASSWORD || secrets.TIMESCALE_SERVICE_PASSWORD }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
